# Builds the Windows portable .exe when a version tag (v1.2.3) is pushed, and attaches it
# (with the FFmpeg source it bundles, for the GPL) to that tag's GitHub release.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
      - run: npm run build:portable
      - name: FFmpeg source for the bundled binary (GPLv3)
        shell: bash
        run: |
          v=$(tr -d '\r\n' < vendor-bin/FFMPEG-VERSION.txt)
          curl -fsSL -o "dist/ffmpeg-$v.tar.xz" "https://ffmpeg.org/releases/ffmpeg-$v.tar.xz"
      - uses: actions/upload-artifact@v4
        with:
          name: portable
          path: |
            dist/*-portable.exe
            dist/ffmpeg-*.tar.xz
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "Desk Phonograph ${tag#v}" --notes "Windows portable build."
          # never replaces assets already on the release (upload fails per existing name; that is fine)
          for f in dist/*-portable.exe dist/ffmpeg-*.tar.xz; do gh release upload "$tag" "$f" || echo "$(basename "$f") is already attached"; done
